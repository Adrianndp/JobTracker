[project]
name = "jobtracker-mcp"
version = "0.1.0"
description = "MCP server for the Job Tracker (standalone microservice)"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
