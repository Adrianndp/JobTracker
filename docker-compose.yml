services:
  db:
    image: postgres:17-alpine
    container_name: jobtracker-db
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"              # host-only, for psql/backups; 5432 is often taken by a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobtracker-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]   # cache only; nothing to persist
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: jobtracker-backend
    environment:
      SECRET_KEY: ${SECRET_KEY:-}                        # empty → generated once into backend/instance/secret_key
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},backend   # `backend`: the mcp container calls http://backend:5001
      HTTPS: ${HTTPS:-0}                                 # 1 enables SSL redirect, HSTS and secure cookies
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0} # legacy alias for HTTPS, still honoured
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}    # e.g. chrome-extension://<id>
      TRUSTED_PROXY_COUNT: 1                             # nginx below is the one proxy in front
      DATABASE_URL: postgres://jobtracker:${POSTGRES_PASSWORD}@db:5432/jobtracker
      REDIS_URL: redis://redis:6379/0
      RESEND_API_KEY: ${RESEND_API_KEY:-}                # empty → account emails print to the backend log
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      # Billing via Paddle; off (and no plan limits) until key, token and a price are set
      PADDLE_ENVIRONMENT: ${PADDLE_ENVIRONMENT:-sandbox}     # sandbox | production
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_PRICE_MONTHLY: ${PADDLE_PRICE_MONTHLY:-}
      PADDLE_PRICE_QUARTERLY: ${PADDLE_PRICE_QUARTERLY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}                        # empty → no error tracking
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}             # gunicorn workers, ~2 x CPU cores
    volumes:
      - ./backend/instance:/app/instance   # secret_key
    ports:
      - "127.0.0.1:5001:5001"              # direct API access / debugging (host only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: jobtracker-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mcp:
    build: ./mcp_server                    # standalone MCP server; reaches jobs only through the backend's /api/
    container_name: jobtracker-mcp
    environment:
      BACKEND_URL: http://backend:5001     # no depends_on: it starts without the backend and reports it unreachable
    ports:
      - "127.0.0.1:8001:8000"              # MCP endpoint at /mcp (host only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
